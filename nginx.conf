server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tres paginas estaticas: /  ·  /tienda/  ·  /v2/
  # Sin ruta sin barra final nginx redirige solo (/tienda -> /tienda/).
  location / { try_files $uri $uri/ =404; }

  # El HTML se revalida SIEMPRE. Sin esta cabecera el navegador aplica frescura heuristica
  # (RFC 9111 §4.2.2) y puede servir una copia vieja del disco sin preguntar: en una demo
  # eso significa proyectar el sitio de la semana pasada sin que nadie se entere. El costo
  # es un 304 por visita, que es nada.
  #
  # Cubre tambien / y /tienda/ y /v2/: el `index` hace redireccion interna a <ruta>index.html
  # y es esta location la que termina aplicando. Por eso no hay bloques `location = /` — serian
  # decorativos, la cabecera que gana es la del destino final.
  location ~* \.html$ { add_header Cache-Control "no-cache"; }

  # Las imagenes de v2/ tienen nombre fijo, sin hash de contenido: cambiar gancho2.webp no
  # cambia la URL. Por eso una hora y no un anio — inmutable seria mentira y dejaria a la
  # gente viendo la imagen vieja hasta que limpie cache.
  # Solo `add_header`, sin `expires`: los dos juntos mandan DOS Cache-Control en la misma
  # respuesta (verificado), y cual gana queda a criterio del cliente.
  location /v2/img/ { add_header Cache-Control "public, max-age=3600"; }
}
