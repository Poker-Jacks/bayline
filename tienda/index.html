:root{
  --carta:#F5F2E9; --marea:#0C1622; --sonda:#12405E; --canal:#3E7CA6; --bajio:#BDD3DE;
  --boya:#E8613C; --boya-d:#cf4f28; --tinta:#101C26; --espuma:#F2F6F8; --gris:#5E6E79;
  --surface:#FBF9F2; --line:#E2DCC9; --ok:#2f9e63; --warn:#c98a2b;
  --sans:'Author',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --s-1:.8rem; --s0:1rem; --s1:1.25rem; --s2:1.5625rem; --s3:1.953rem; --s4:2.441rem;
  --ez:cubic-bezier(.3,0,.2,1); --wrap:1280px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--carta);color:var(--tinta);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none;cursor:pointer}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.018em;line-height:1.06;text-wrap:balance}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--tinta)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.pico{color:var(--sonda)}
.hidden{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 18px;border-radius:10px;border:1.5px solid transparent;transition:background .18s,border-color .18s,transform .15s var(--ez)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.pri{background:var(--boya);color:var(--tinta)}
.btn.pri:hover{background:var(--boya-d);transform:translateY(-1px)}
.btn.gho{background:transparent;color:var(--sonda);border-color:var(--line)}
.btn.gho:hover{border-color:var(--sonda)}
.btn.dark{background:var(--marea);color:var(--espuma)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--boya);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--tinta)}
.chip.on{background:var(--sonda);color:var(--espuma);border-color:var(--sonda)}
.badge-ok{color:var(--ok)}.badge-low{color:var(--boya)}.badge-out{color:var(--gris)}

/* franja aviso */
.ann{background:var(--marea);color:#a9c0cf;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;padding:8px 16px}
.ann b{color:var(--boya);font-weight:600}

/* header storefront */
.hdr{position:sticky;top:0;z-index:60;background:var(--carta);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;padding:13px 24px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand svg{width:38px;height:38px;color:var(--sonda);flex-shrink:0}
.brand .lg{display:inline-flex;flex-shrink:0}
.brand .nm{font-weight:700;font-size:19px;letter-spacing:-.015em;line-height:1}
.brand .tg{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--gris);margin-top:3px}
.searchbox{flex:1;position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 15px}
.search svg{width:18px;height:18px;color:var(--gris);flex-shrink:0}
.search input{border:0;background:none;outline:none;flex:1;font-size:14.5px}
.ac{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 50px -24px rgba(18,64,94,.45);overflow:hidden;z-index:70}
.ac a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ac a:last-child{border-bottom:0}.ac a:hover{background:var(--carta)}
.ac .th{width:38px;height:38px;border-radius:8px;background:var(--bajio);display:grid;place-items:center;flex-shrink:0}
.ac .th svg{width:20px;height:20px;color:var(--sonda)}
.ac .t{font-weight:600;font-size:13.5px}
.ac .m{font-family:var(--mono);font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.ac .p{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--sonda)}
.almacen{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:7px 12px;cursor:pointer;flex-shrink:0;background:var(--surface);position:relative}
.almacen svg.st{width:18px;height:18px;color:var(--sonda)}
.almacen .a-l{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.almacen .a-v{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px}
.almacen .dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 50px -24px rgba(18,64,94,.45);min-width:230px;overflow:hidden;z-index:70}
.almacen .dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 15px;font-size:13.5px;border-bottom:1px solid var(--line)}
.almacen .dd button:hover{background:var(--carta)}.almacen .dd button.sel{color:var(--sonda);font-weight:600}
.wa{width:44px;height:44px;border-radius:11px;background:var(--boya);display:grid;place-items:center;flex-shrink:0;color:var(--tinta)}
.wa svg{width:22px;height:22px}
.nav{border-top:1px solid var(--line)}
.nav .wrap{display:flex;gap:26px;padding:0 24px;overflow-x:auto}
.nav a{display:flex;align-items:center;gap:7px;padding:12px 0;font-size:13.5px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:var(--sonda);border-bottom-color:var(--boya)}
.nav a svg{width:15px;height:15px;color:var(--gris)}

/* hero */
.hero{padding:22px 0}
.banner{background:var(--marea);border-radius:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;padding:44px}
.banner .locs{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--bajio);text-transform:uppercase}
.banner h1{color:var(--espuma);font-size:clamp(var(--s3),4vw,var(--s4));letter-spacing:-.025em;margin:16px 0 0;max-width:15ch}
.banner .sub{color:#a9c0cf;font-size:16px;max-width:46ch;margin:16px 0 26px}
.banner .cta-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.banner .lnk{color:var(--bajio);font-size:13.5px;border-bottom:1px solid var(--bajio);padding-bottom:2px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.hcard{background:var(--surface);border-radius:13px;padding:13px}
.hcard .im{aspect-ratio:1.3;border-radius:8px;background:var(--bajio);display:grid;place-items:center;margin-bottom:9px}
.hcard .im svg{width:48%;height:48%}
.hcard .pz b{font-family:var(--mono);font-size:15px;font-weight:600}
.hcard .pz s{font-family:var(--mono);font-size:11.5px;color:var(--gris);margin-left:7px}

/* ticker */

/* trust */
.trust{padding:20px 0}
.trust .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 18px}
.tcard svg{width:22px;height:22px;color:var(--sonda);flex-shrink:0}
.tcard b{font-weight:600;font-size:14.5px}.tcard span{display:block;font-size:12.5px;color:var(--gris)}

/* secciones */
.sec{padding:32px 0}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.shead h2{font-size:var(--s2)}
.shead p{color:var(--gris);font-size:14px;margin:6px 0 0}
.shead .more{color:var(--sonda);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.shead .more svg{width:16px;height:16px}
.pagetitle{padding:26px 0 4px}
.pagetitle .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);margin-bottom:12px}
.pagetitle .crumb a:hover{color:var(--sonda)}
.pagetitle h1{font-size:var(--s3)}
.pagetitle p{color:var(--gris);font-size:15px;margin:10px 0 0;max-width:60ch}

/* product grid + card */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;position:relative;transition:border-color .2s,box-shadow .2s}
.prod:hover{border-color:var(--bajio);box-shadow:0 14px 34px -24px rgba(18,64,94,.4)}
.disc{position:absolute;top:12px;left:12px;background:var(--boya);color:var(--tinta);font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;z-index:1}
.prod .im{aspect-ratio:1;border-radius:10px;background:var(--bajio);display:grid;place-items:center;margin-bottom:12px}
.prod .im svg{width:44%;height:44%}
.avail{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;font-weight:500;line-height:1.3}
.avail svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.prod .nm{font-weight:600;font-size:14px;line-height:1.3;margin:8px 0 3px;min-height:36px}
.prod .brand{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris)}
.prod .pz{display:flex;align-items:baseline;gap:6px 9px;flex-wrap:wrap;margin:11px 0 1px}
.prod .pz b{font-family:var(--mono);font-size:20px;font-weight:600}
.prod .pz s{font-family:var(--mono);font-size:12.5px;color:var(--gris)}
.prod .iva{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin-bottom:12px}
.prod .actions{display:flex;gap:8px;margin-top:auto}
.prod .actions .btn{flex:1}
.wa2{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--sonda);flex-shrink:0;background:none}
.wa2 svg{width:19px;height:19px}

/* catalog toolbar */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.toolbar .chips{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .ord{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris)}
.toolbar select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface)}

/* bento departamentos */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.dep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:border-color .2s,transform .2s var(--ez)}
.dep:hover{border-color:var(--bajio);transform:translateY(-3px)}
.dep .di{position:absolute;top:16px;right:16px;color:var(--bajio)}.dep .di svg{width:46px;height:46px}
.dep .dn{font-weight:600;font-size:15px}.dep .dc{font-size:12px;color:var(--gris);margin-top:2px}
.dep.big{grid-column:span 2;grid-row:span 2}.dep.big .di svg{width:92px;height:92px}.dep.big .dn{font-size:var(--s1)}

/* how / reviews */
.hgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hstep .n{width:38px;height:38px;border-radius:10px;background:var(--carta);border:1px solid var(--line);display:grid;place-items:center;color:var(--sonda);margin-bottom:13px}
.hstep .n svg{width:20px;height:20px}
.hstep h3{font-size:var(--s1)}.hstep p{color:var(--gris);font-size:14px;margin:8px 0 0;max-width:34ch}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.stars{color:var(--boya);margin-bottom:12px;font-size:15px}
.rev p{font-size:14.5px}.rev .src{font-family:var(--mono);font-size:11px;color:var(--gris);margin-top:14px}

/* producto detail */
.pdet{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:20px 0 10px}
.gallery{background:var(--surface);border:1px solid var(--line);border-radius:16px;aspect-ratio:1;display:grid;place-items:center}
.gallery svg{width:38%;height:38%;color:var(--sonda)}
.pinfo .sku{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.pinfo h1{font-size:var(--s3);margin:8px 0}
.pinfo .desc{color:var(--gris);font-size:15px}
.pinfo .av2{margin:16px 0;font-weight:500}
.pinfo .price{display:flex;align-items:baseline;gap:12px;margin:6px 0}
.pinfo .price b{font-family:var(--mono);font-size:34px;font-weight:700}
.pinfo .price s{font-family:var(--mono);font-size:16px;color:var(--gris)}
.ivatoggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.ivatoggle button{background:var(--surface);border:0;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--gris)}
.ivatoggle button.on{background:var(--sonda);color:var(--espuma)}
.pinfo .ref{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);margin:6px 0 18px}
.pinfo .pactions{display:flex;gap:10px;flex-wrap:wrap}
.pinfo .pactions .btn{flex:1;white-space:nowrap;min-width:max-content}
.specs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:22px}
.specs h3{font-size:var(--s1);margin-bottom:12px}
.specs ul{margin:0;padding-left:18px;color:var(--gris);font-size:14px}.specs li{margin:5px 0}
.avtable{margin-top:34px}
.avrow{display:flex;align-items:center;gap:16px;padding:15px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:9px}
.avrow .info{flex:1}.avrow .info b{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.avrow .info .adr{font-size:12.5px;color:var(--gris);margin-top:2px}
.avrow .st{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}.avrow .st svg{width:15px;height:15px}
.avrow .cta{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;display:flex;align-items:center;gap:7px;color:var(--sonda)}
.avrow .cta svg{width:15px;height:15px}
.tag-su{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--sonda);color:var(--espuma);padding:2px 7px;border-radius:5px}

/* sucursales / marcas */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px}
.wcard b{font-weight:600;font-size:15px}.wcard .adr{font-size:13px;color:var(--gris);margin:5px 0 14px}
.sectitle{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--boya);margin:24px 0 12px}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;text-align:center;transition:border-color .2s}
.bcard:hover{border-color:var(--bajio)}
.bcard .th3{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.bcard .th3 span{width:38px;height:38px;border-radius:8px;background:var(--bajio);display:grid;place-items:center}
.bcard .th3 svg{width:20px;height:20px;color:var(--sonda)}
.bcard b{font-weight:600;font-size:14px}.bcard .c{font-family:var(--mono);font-size:11px;color:var(--gris);margin-top:3px}

/* cotización */
.form{max-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--carta);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sonda)}
.field textarea{min-height:120px;resize:vertical;font-family:var(--sans)}
.form .note{font-size:12.5px;color:var(--gris);margin-top:12px}
/* checkout / pago (Fase 2) */
.ckgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.ckcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.ckcard h3{font-size:var(--s1);margin-bottom:16px}
.ckline{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.ckline .th{width:44px;height:44px;border-radius:9px;background:var(--bajio);display:grid;place-items:center;flex-shrink:0}
.ckline .th svg{width:23px;height:23px;color:var(--sonda)}
.ckline .nm{font-weight:600;font-size:14px}.ckline .q{font-family:var(--mono);font-size:11px;color:var(--gris);margin-top:2px}
.ckline .pr{margin-left:auto;font-family:var(--mono);font-weight:600}
.cktot .r{display:flex;justify-content:space-between;font-size:14px;color:var(--gris);padding:5px 0}
.cktot .r .num{font-family:var(--mono);color:var(--tinta)}
.cktot .r.t{border-top:1px solid var(--line);margin-top:8px;padding-top:13px;font-size:18px;font-weight:700;color:var(--tinta)}
.pmeth{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.pm2{border:1.5px solid var(--line);border-radius:11px;padding:13px 8px;text-align:center;font-weight:600;font-size:13px;cursor:pointer}
.pm2.on{border-color:var(--boya);background:rgba(232,97,60,.07)}
.seg{font-size:12.5px;color:var(--gris);text-align:center;margin-top:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.seg svg{width:15px;height:15px;color:var(--ok)}
/* logística / Dockbay (Fase 3) */
.logibar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.logistat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.logistat b{font-family:var(--mono);font-size:26px;font-weight:700;display:block;line-height:1}
.logistat span{font-size:12.5px;color:var(--gris);margin-top:5px;display:block}
.ordcard{display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:9px}
.ordcard .g{font-family:var(--mono);font-size:12px;color:var(--sonda);font-weight:600}
.ordcard .d{font-size:14px;font-weight:500}.ordcard .d small{display:block;color:var(--gris);font-weight:400;font-family:var(--mono);font-size:11px;margin-top:2px}
.ordcard .chof{font-size:12.5px;color:var(--gris)}
.opill{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:20px;white-space:nowrap}
.opill.bod{color:var(--gris);border:1px solid var(--line)}
.opill.ruta{color:var(--boya);border:1px solid rgba(232,97,60,.5)}
.opill.ok{color:var(--ok);border:1px solid rgba(47,158,99,.4)}
@media(max-width:800px){.ckgrid{grid-template-columns:1fr}.logibar{grid-template-columns:1fr 1fr}.ordcard{grid-template-columns:1fr auto;gap:8px}.ordcard .chof{display:none}}

/* footer */
.foot{background:var(--marea);color:#a9c0cf;padding:48px 0 24px;margin-top:14px}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding-bottom:30px;border-bottom:1px solid #22323f}
.foot .brand svg{color:var(--bajio)}.foot .brand .nm{color:var(--espuma)}
.foot .fabout{font-size:13.5px;line-height:1.6;margin-top:14px;max-width:34ch}
.foot h4{color:var(--espuma);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 13px;font-weight:600}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.foot a:hover{color:var(--espuma)}
.foot .bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;font-family:var(--mono);font-size:11.5px}
.foot .made b{color:var(--bajio);font-weight:600}
.adminlink{color:#6f8598}.adminlink:hover{color:var(--boya)}

/* ===== ADMIN ===== */
.admin{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.aside{background:var(--marea);color:#a9c0cf;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.aside .abrand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;border-bottom:1px solid #22323f;margin-bottom:16px}
.aside .abrand svg{width:32px;height:32px;color:var(--bajio)}
.aside .abrand .nm{color:var(--espuma);font-weight:700;font-size:16px;line-height:1}
.aside .abrand .r{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--boya);text-transform:uppercase;margin-top:3px}
.aside nav{display:flex;flex-direction:column;gap:3px;flex:1}
.aside nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#a9c0cf}
.aside nav a svg{width:18px;height:18px}
.aside nav a:hover{background:#16283a;color:var(--espuma)}
.aside nav a.on{background:var(--sonda);color:var(--espuma)}
.aside .out{margin-top:auto;padding:11px 12px;border-radius:9px;font-size:14px;display:flex;align-items:center;gap:11px;color:#a9c0cf;background:none;border:0;text-align:left}
.aside .out:hover{background:#16283a;color:var(--espuma)}
.aside .out svg{width:18px;height:18px}
.amain{background:var(--carta);min-width:0}
.abar{background:#fdf6ec;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--gris);padding:8px 28px;letter-spacing:.02em}
.acontent{padding:28px}
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.ahead h1{font-size:var(--s2)}.ahead .sub{color:var(--gris);font-size:13.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat .si{width:40px;height:40px;border-radius:10px;background:var(--carta);border:1px solid var(--line);display:grid;place-items:center;color:var(--sonda);margin-bottom:14px}
.stat .si svg{width:20px;height:20px}
.stat b{font-family:var(--mono);font-size:30px;font-weight:700;display:block;line-height:1}
.stat span{font-size:13px;color:var(--gris);margin-top:5px;display:block}
.acards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.acard h3{font-size:var(--s1);margin-bottom:14px}
.qa{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}.qa svg.i{width:20px;height:20px;color:var(--sonda)}
.qa b{font-weight:600;font-size:14px}.qa span{display:block;font-size:12.5px;color:var(--gris)}
.qa .ar{margin-left:auto;color:var(--gris)}
.bar{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:13px}
.bar .bl{width:180px;color:var(--gris);flex-shrink:0}
.bar .bt{flex:1;height:9px;background:var(--carta);border-radius:5px;overflow:hidden}
.bar .bf{height:100%;background:var(--sonda);border-radius:5px}
.bar .bn{font-family:var(--mono);font-weight:600;width:28px;text-align:right}
.empty{color:var(--gris);font-size:13.5px;padding:8px 0}

/* admin tables */
.atoolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.atoolbar input,.atoolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--surface)}
.atoolbar .sr{position:relative;flex:1;min-width:220px;max-width:360px}

function seedProducts(){
  const P=[]; let n=1;
  for(let i=0;i<24;i++){
    const cat=CATS[i%CATS.length], brand=BRANDS[i%BRANDS.length], icon=ICONS[i%ICONS.length];
    const base=[8250,15400,9800,32000,1300,1820,25500,96500,4200,12900][i%10];
    const promo=(i%3===0);
    const av={}; SEED_BRANCHES.forEach((b,j)=>av[b.id]=STATES[(i+j)%STATES.length]);
    P.push({id:'p'+n, t:'Producto '+String(n).padStart(2,'0'), brand, cat:cat.id, icon,
      price:base, before:promo?Math.round(base*1.3):0, unit:'Uni',
      desc:'Producto de ejemplo para ilustrar la plantilla. Reemplace por su descripción real: características, medidas y uso.', av});
    n++;
  }
  return P;
}

function seedOrders(prods){
  const est=['entregado','entregado','entregado','ruta','prep','entregado','entregado','ruta','entregado','entregado','prep','entregado'];
  const cli=['c1','c3','c2','c1','c5','c3','c4','c1','c6','c2','c3','c5'];
  const dias=[92,84,71,63,55,48,40,33,26,19,11,4];
  return dias.map((d,i)=>{
    const n=1+(i%3), items=[];
    for(let k=0;k<n;k++){const p=prods[(i*3+k)%prods.length]; items.push({id:p.id,t:p.t,brand:p.brand,icon:p.icon,price:p.price,q:1+((i+k)%3)});}
    const sub=items.reduce((a,l)=>a+l.price*l.q,0);
    return {ord:'BL-2026-'+String(100+i).padStart(4,'0'), cli:cli[i], ts:Date.now()-d*86400000,
      metodo:['SINPE M&oacute;vil','Tarjeta','Transferencia'][i%3], suc:SEED_BRANCHES[i%3].n,
      guia:'GUIA 04-'+String(1100+i).padStart(4,'0'), lines:items, sub:sub, envio:3500, tot:sub+3500, est:est[i]};
  });
}

function load(){ let d=null;
  try{const r=localStorage.getItem(KEY); if(r) d=JSON.parse(r);}catch(e){}
  if(!d) d={products:seedProducts(), branches:SEED_BRANCHES.map(b=>({...b}))};
  if(!d.customers) d.customers=SEED_CUSTOMERS.map(c=>({...c}));
  if(!d.orders) d.orders=seedOrders(d.products);
  return d; }

let pImg=null;
function imgResize(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const M=680,sc=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.72));};
    im.onerror=()=>cb('');
    im.src=r.result;};
  r.readAsDataURL(file);
}
function bindFoto(p){
  const prev=document.getElementById('d-prev'), f=document.getElementById('d-file'),
        rm=document.getElementById('d-rm'), url=document.getElementById('d-img');

  const paint=src=>{prev.innerHTML=src?`<img src="${src}" alt="">`:`<span class="ph">${pio(p?p.icon:ICONS[0])}</span>`;};
  if(f)f.onchange=()=>{const file=f.files&&f.files[0]; if(!file)return;
    imgResize(file,d=>{pImg=d; if(url)url.value=''; paint(d);});};
  if(url)url.oninput=()=>{pImg=url.value.trim()||null; paint(pImg);};
  if(rm)rm.onclick=()=>{pImg=''; if(url)url.value=''; paint('');};
}

let drawerSave=null;
function drawer(title,body,onSave){

/* ============ CARRITO (demostración) ============ */
const CKEY='bayline-cart-v1', ENVIO=3500;
let CART=(()=>{try{return JSON.parse(localStorage.getItem(CKEY))||[]}catch(e){return []}})();
const cartSave=()=>{try{localStorage.setItem(CKEY,JSON.stringify(CART))}catch(e){}};
const cartCount=()=>CART.reduce((a,l)=>a+l.q,0);
const cartLines=()=>CART.map(l=>({q:l.q,p:DB.products.find(p=>p.id===l.id)})).filter(l=>l.p);
const cartSub=()=>cartLines().reduce((a,l)=>a+l.p.price*l.q,0);
function cartAdd(id,q){const l=CART.find(x=>x.id===id);
  if(l)l.q=Math.min(99,l.q+(q||1)); else CART.push({id:id,q:q||1});
  cartSave();cartBadge();cartPing();}
function cartSet(id,q){const l=CART.find(x=>x.id===id); if(!l)return;
  l.q=Math.max(0,Math.min(99,q)); if(!l.q)CART=CART.filter(x=>x.id!==id); cartSave();cartBadge();}
function cartClear(){CART=[];cartSave();cartBadge();}
function cartBadge(){const b=document.getElementById('cartn'); if(!b)return;
  const n=cartCount(); b.textContent=n; b.classList.toggle('hidden',!n);}
function cartPing(){const c=document.getElementById('cartbtn'); if(!c)return;
  c.classList.remove('ping'); void c.offsetWidth; c.classList.add('ping');}
function toast(txt){let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.innerHTML=I.check+'<span>'+txt+'</span>';
  requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('on'),2100);}

function bindDatos(){

  const nx=g('k-next'); if(!nx)return;
  nx.onclick=()=>{
    CKD.nom=(g('k-nom').value||'').trim(); CKD.tel=(g('k-tel').value||'').trim();
    CKD.not=(g('k-not').value||'').trim();
    if(CKD.modo==='retiro'){CKD.suc=g('k-suc')?g('k-suc').value:''; CKD.dir='';}
    else {CKD.dir=(g('k-dir')?g('k-dir').value:'').trim(); CKD.suc='';}

    location.hash='#/pago';
  };
}
const PM={sinpe:{n:'SINPE M&oacute;vil',f:`<div class="field"><label>N&uacute;mero SINPE M&oacute;vil</label><input value="8888-8888"></div><div class="field"><label>Nombre de quien paga</label><input id="pay-nom" placeholder="Nombre y apellido"></div>`},
 tarjeta:{n:'Tarjeta',f:`<div class="field"><label>N&uacute;mero de tarjeta</label><input value="4242 4242 4242 4242"></div><div class="field"><label>Vence</label><input value="12/29"></div><div class="field"><label>Nombre en la tarjeta</label><input id="pay-nom" placeholder="Nombre y apellido"></div>`},
 transfer:{n:'Transferencia',f:`<div class="field"><label>Banco</label><input value="Banco Nacional"></div><div class="field"><label>Comprobante</label><input placeholder="N&uacute;mero de comprobante"></div><div class="field"><label>Nombre de quien paga</label><input id="pay-nom" placeholder="Nombre y apellido"></div>`}};
let PMSEL='sinpe';

          ${CKD.not?`<div class="d">Nota: ${CKD.not}</div>`:''}</div>
        <a class="lnk" href="#/datos">Modificar</a>

      ${ls.map(l=>`<div class="ckline"><span class="th">${pimg(l.p)}</span><div><div class="nm">${l.p.t}</div><div class="q">${l.p.brand} &middot; ${l.q} unidad${l.q===1?'':'es'}</div></div><span class="pr">${money(l.p.price*l.q)}</span></div>`).join('')}
      <div class="cktot"><div class="r"><span>Subtotal</span><span class="num">${money(sub)}</span></div>
        <div class="r"><span>${CKD.modo==='retiro'?'Retiro en sucursal':'Env&iacute;o a domicilio'}</span><span class="num">${env?money(env):'Sin costo'}</span></div>

    </div>
  </div></div></section>`+footer();
}

function payDemo(){
  const tot=cartSub()+envioActual();
  const ov=document.createElement('div'); ov.className='payov'; ov.id='payov';
  ov.innerHTML=`<div class="paybox"><div class="spin"></div>
    <h3>Conectando con la pasarela</h3><p>Autorizando ${money(tot)} por ${PM[PMSEL].n}...</p></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    let n=1;
    try{n=(parseInt(localStorage.getItem('bayline-ord')||'0',10)||0)+1;localStorage.setItem('bayline-ord',n);}catch(e){}
    const ord='BL-2026-'+String(n).padStart(4,'0');
    ordCreate(ord, PM[PMSEL].n);
    ov.innerHTML=`<div class="paybox"><div class="okmark">${I.check.replace('<svg','<svg width=30 height=30')}</div>
      <h3>Pago aprobado</h3><p>Su pedido qued&oacute; registrado y pasa a preparaci&oacute;n en bodega.</p>
      <div class="ordn">${ord}</div>
      <p style="font-size:12.5px">Demostraci&oacute;n: no se realiz&oacute; ning&uacute;n cobro real.</p>
      <div class="acts"><a class="btn pri" href="#/pedido/${ord}" onclick="closePay()">Ver el seguimiento</a>
      <a class="btn gho" href="#/catalogo" onclick="closePay()">Seguir comprando</a></div></div>`;
    cartClear();
  },1700);
}
window.closePay=function(){const o=document.getElementById('payov'); if(o)o.remove();};
addEventListener('hashchange',window.closePay);

document.addEventListener('click',function(e){
  const add=e.target.closest('[data-add]');
  if(add){cartAdd(add.dataset.add,1);toast('Agregado al carrito');return;}
  const addq=e.target.closest('[data-addq]');
  if(addq){const sp=document.getElementById('pq');
    cartAdd(addq.dataset.addq,Math.max(1,parseInt(sp?sp.textContent:'1',10)||1));
    toast('Agregado al carrito');return;}
  const dq=e.target.closest('[data-dq]');
  if(dq){const sp=document.getElementById('pq'); if(sp){
    sp.textContent=Math.max(1,Math.min(99,(parseInt(sp.textContent,10)||1)+parseInt(dq.dataset.dq,10)));}return;}
  const q=e.target.closest('[data-q]');
  if(q){const l=CART.find(x=>x.id===q.dataset.q);
    cartSet(q.dataset.q,(l?l.q:0)+parseInt(q.dataset.d,10)); route(); return;}
  const rm=e.target.closest('[data-rm]');
  if(rm){cartSet(rm.dataset.rm,0);route();return;}
  const pm=e.target.closest('[data-pm]');
  if(pm){PMSEL=pm.dataset.pm;
    document.querySelectorAll('.pm2').forEach(x=>x.classList.toggle('on',x===pm));
    const f=document.getElementById('pmfields'); if(f)f.innerHTML=PM[PMSEL].f; return;}
  if(e.target.closest('#paybtn')){payDemo();return;}
});


/* ============ PEDIDOS (demostracion) ============ */
const OKEY='bayline-orders-v1';
const ordLoad=()=>{try{return JSON.parse(localStorage.getItem(OKEY))||[]}catch(e){return []}};
const ordSave=a=>{try{localStorage.setItem(OKEY,JSON.stringify(a))}catch(e){}};
function ordCreate(num,metodo){
  const ls=cartLines(), sub=cartSub();
  const o={ord:num, ts:Date.now(), metodo:metodo,
    suc:CKD.modo==='retiro'?((branch(CKD.suc)||{}).n||branch(ALM).n):branch(ALM).n,
    modo:CKD.modo, dir:CKD.dir||'', nom:CKD.nom||'', tel:CKD.tel||'', nota:CKD.not||'',
    guia:'GUIA 04-'+String(1180+ordLoad().length).padStart(4,'0'),
    lines:ls.map(l=>({t:l.p.t,brand:l.p.brand,icon:l.p.icon,img:l.p.img||'',price:l.p.price,q:l.q})),
    sub:sub, envio:envioActual(), tot:sub+envioActual()};
  const all=ordLoad(); all.unshift(o); ordSave(all);
  /* queda tambien en la base para el panel, ligado a su cliente */
  const nom=(CKD.nom||val('pay-nom')||'').trim()||'Cliente de mostrador';
  const tel=(CKD.tel||'').replace(/[^0-9]/g,'');
  let c=DB.customers.find(x=>x.n.toLowerCase()===nom.toLowerCase());
  if(!c){c={id:'c'+Date.now(),n:nom,tipo:'Persona',wa:tel,mail:'',desde:new Date().toISOString().slice(0,10)};DB.customers.unshift(c);}
  else if(tel&&!c.wa){c.wa=tel;}
  DB.orders.unshift({...o, cli:c.id, est:'prep'});
  save(); logAdd('Pedido nuevo de', nom);
  return o;
}
function ordFmt(ts){try{return new Date(ts).toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'});}catch(e){return '';}}

function viewPedido(num){
  const o=ordLoad().find(x=>x.ord===num);
  const head=header('')+`<div class="wrap pagetitle"><div class="crumb"><a href="#/">Inicio</a> &rsaquo; Seguimiento</div><h1>Seguimiento de su pedido</h1><p>Estado de su compra, paso a paso. <b>Demostraci&oacute;n:</b> los estados son de ejemplo.</p></div>`;
  if(!o) return head+`<section class="sec"><div class="wrap"><div class="ckcard cempty">
    <div class="ic">${I.cart}</div><h3>No encontramos ese pedido</h3>
    <p>El seguimiento se genera al completar una compra en esta demostraci&oacute;n.</p>
    <a class="btn pri" href="#/catalogo">Ver el cat&aacute;logo</a></div></div></section>`+footer();
  const pasos=[
    {b:'Pago aprobado',s:'Su pago qued&oacute; confirmado',st:'done'},
    {b:'Pedido recibido',s:'La tienda confirm&oacute; su pedido',st:'done'},
    {b:'En preparaci&oacute;n en bodega',s:'Estamos alistando sus productos en '+o.suc,st:'now'},
    {b:o.modo==='retiro'?'Listo para retirar':'En ruta',s:o.modo==='retiro'?('Le avisamos cuando pueda pasar por '+o.suc):'Un transportista lo lleva a su direcci&oacute;n',st:''},
    {b:o.modo==='retiro'?'Retirado':'Entregado',s:'Firma de recibido y comprobante',st:''}];
  return head+`<section class="sec"><div class="wrap"><div class="ckgrid">
    <div class="ckcard">
      <div class="ordhead"><div><div class="on">${o.ord}</div><div class="od">Compra del ${ordFmt(o.ts)} &middot; ${o.lines.reduce((a,l)=>a+l.q,0)} art&iacute;culo${o.lines.reduce((a,l)=>a+l.q,0)===1?'':'s'}</div></div>
        <span class="opill bod">En preparaci&oacute;n</span></div>
      <div class="trk">${pasos.map(p=>`<div class="st ${p.st}"><span class="dot">${p.st==='done'?I.check:''}</span>
        <div class="tx"><b>${p.b}</b><span>${p.s}</span></div></div>`).join('')}</div>
      <div class="ordmeta">
        <div class="m"><div class="k">Gu&iacute;a</div><div class="v">${o.guia}</div></div>
        <div class="m"><div class="k">${o.modo==='retiro'?'Retira en':'Sale de'}</div><div class="v">${o.suc}</div></div>
        <div class="m" style="grid-column:1/-1"><div class="k">${o.modo==='retiro'?'Retira':'Entrega a'}</div><div class="v">${o.nom||'Cliente'}${o.tel?' &middot; '+o.tel:''}</div>${o.dir?`<div class="k" style="text-transform:none;letter-spacing:0;font-size:12.5px;margin-top:4px">${o.dir}</div>`:''}</div>
        <div class="m"><div class="k">Entrega estimada</div><div class="v">24 a 48 horas</div></div>
        <div class="m"><div class="k">Pagado con</div><div class="v">${o.metodo}</div></div>
      </div>
    </div>
    <div class="ckcard"><h3>Lo que viene en camino</h3>
      ${o.lines.map(l=>`<div class="ckline"><span class="th">${pimg(l)}</span><div><div class="nm">${l.t}</div><div class="q">${l.brand} &middot; ${l.q} unidad${l.q===1?'':'es'}</div></div><span class="pr">${money(l.price*l.q)}</span></div>`).join('')}
      <div class="cktot"><div class="r"><span>Subtotal</span><span class="num">${money(o.sub)}</span></div>
        <div class="r"><span>Env&iacute;o a domicilio</span><span class="num">${money(o.envio)}</span></div>
        <div class="r t"><span>Total pagado</span><span class="num">${money(o.tot)}</span></div></div>
      <a class="btn gho" href="#/catalogo" style="width:100%;margin-top:16px">Seguir comprando</a>
      <div class="seg">${I.check} Le avisamos por WhatsApp en cada cambio de estado</div>
    </div>
  </div></div></section>`+footer();
}
/* ============ ROUTER ============ */
function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  const [path,qs]=h.split('?'); const params=new URLSearchParams(qs||'');
  const app=document.getElementById('app');
  const seg=path.split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(seg[0]==='admin'){
    if(!isAuthed()){app.innerHTML=viewLogin(false);bindLogin();return;}
    const sub=seg[1]||'panel';
    if(sub==='panel')app.innerHTML=viewAdminPanel();
    else if(sub==='productos'){app.innerHTML=viewAdminProd();bindAdminProd();renderProdTable();}
    else if(sub==='sucursales'){app.innerHTML=viewAdminSuc();renderSucTable();}
    else if(sub==='clientes'){app.innerHTML=viewAdminCli();renderCliTable();bindAdminCli();}
    else if(sub==='config')app.innerHTML=viewAdminCfg();
    else app.innerHTML=viewAdminPanel();
    const lo=document.getElementById('logout'); if(lo)lo.onclick=()=>{sessionStorage.removeItem(ADMKEY);location.hash='#/';};
    return;
  }
  if(seg[0]==='datos'){app.innerHTML=viewDatos();bindDatos();}
  else if(seg[0]==='pedido')app.innerHTML=viewPedido(decodeURIComponent(seg[1]||''));
  else if(seg[0]==='carrito')app.innerHTML=viewCarrito();
  else if(seg[0]==='producto'){app.innerHTML=viewProducto(seg[1]);bindProducto();}
  else if(seg[0]==='catalogo'){app.innerHTML=viewCatalogo(params);bindCatalogo();}
  else if(seg[0]==='promociones')app.innerHTML=viewPromos();
  else if(seg[0]==='marcas')app.innerHTML=viewMarcas();
  else if(seg[0]==='sucursales')app.innerHTML=viewSucursales();
  else if(seg[0]==='cotizacion'){app.innerHTML=viewCotizacion();bindCotizacion();}
  else if(seg[0]==='pago')app.innerHTML=viewPago();
  else if(seg[0]==='logistica')app.innerHTML=viewLogistica();
  else app.innerHTML=viewHome();
  bindHeader();
}
/* ============ BINDINGS ============ */
function bindHeader(){
  cartBadge();
  const alm=document.getElementById('almbtn'), dd=document.getElementById('almdd');
  if(alm){alm.onclick=e=>{if(e.target.closest('[data-alm]'))return;dd.classList.toggle('hidden');};
    dd.querySelectorAll('[data-alm]').forEach(b=>b.onclick=()=>{ALM=b.dataset.alm;route();});
    document.addEventListener('click',e=>{if(!alm.contains(e.target))dd.classList.add('hidden');},{once:true});}
  const q=document.getElementById('q'), ac=document.getElementById('ac');
  if(q){q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v){ac.innerHTML='';return;}
    const r=DB.products.filter(p=>p.t.toLowerCase().includes(v)||p.brand.toLowerCase().includes(v)).slice(0,6);
    ac.innerHTML=r.length?`<div class="ac">${r.map(p=>`<a href="#/producto/${p.id}"><span class="th">${pimg(p)}</span><div><div class="t">${p.t}</div><div class="m">${p.brand} · ${catName(p.cat)}</div></div><span class="p">${money(p.price)}</span></a>`).join('')}</div>`:'';};
    q.onkeydown=e=>{if(e.key==='Enter'){const v=q.value.trim().toLowerCase();const first=DB.products.find(p=>p.t.toLowerCase().includes(v)||p.brand.toLowerCase().includes(v));if(first)location.hash='#/producto/'+first.id;}};
    q.onblur=()=>setTimeout(()=>{if(ac)ac.innerHTML='';},180);}
}
function bindCatalogo(){
  const grid=document.getElementById('catgrid'); if(!grid)return; const cat=grid.dataset.cat;
  let brand='',ord='rel';
  const render=()=>{let l=DB.products.filter(p=>p.cat===cat); if(brand)l=l.filter(p=>p.brand===brand);
    if(ord==='pa')l.sort((a,b)=>a.price-b.price); if(ord==='pd')l.sort((a,b)=>b.price-a.price);
    grid.innerHTML=l.map(productCard).join('')||'<p style="color:var(--gris)">Sin productos.</p>';};
  document.querySelectorAll('#brandchips .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#brandchips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');brand=c.dataset.brand;render();});
  const os=document.getElementById('ord'); if(os)os.onchange=()=>{ord=os.value;render();};
}
function bindProducto(){
  document.querySelectorAll('[data-iva]').forEach(b=>b.onclick=()=>{IVA=b.dataset.iva==='1';route();});
}
function bindCotizacion(){
  const s=document.getElementById('ct-send'); if(!s)return;
  s.onclick=()=>{const nom=val('ct-nom'),num=document.getElementById('ct-suc').value,lista=val('ct-lista');
    const msg='Hola, soy '+(nom||'un cliente')+'. Quiero cotizar (demo):\n'+(lista||'(mi lista)');
    window.open(waLink(num,msg),'_blank');};
}
function bindAdminProd(){
  const q=document.getElementById('ap-q'), cat=document.getElementById('ap-cat');
  q.oninput=()=>{admProdState.q=q.value;admProdState.page=1;renderProdTable();};
  cat.onchange=()=>{admProdState.cat=cat.value;admProdState.page=1;renderProdTable();};
  document.getElementById('ap-clear').onclick=()=>{admProdState.q='';admProdState.cat='';admProdState.page=1;q.value='';cat.value='';renderProdTable();};
  document.querySelectorAll('.tbl thead th[data-s]').forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(admProdState.sort===s)admProdState.dir*=-1;else{admProdState.sort=s;admProdState.dir=1;}renderProdTable();});
}

function bindAdminCli(){
  const q=document.getElementById('ac-q'), cl=document.getElementById('ac-clear');
  if(q)q.oninput=()=>{admCliQ=q.value.trim();renderCliTable();};
  if(cl)cl.onclick=()=>{admCliQ='';if(q)q.value='';renderCliTable();};
}
function bindLogin(){
  const go=()=>{const u=val('lg-user'),p=val('lg-pass');if(u==='admin'&&p==='bayline2026'){sessionStorage.setItem(ADMKEY,'1');location.hash='#/admin/panel';route();}else{document.getElementById('app').innerHTML=viewLogin(true);bindLogin();}};
  document.getElementById('lg-in').onclick=go;
  document.getElementById('lg-pass').onkeydown=e=>{if(e.key==='Enter')go();};
}
addEventListener('hashchange',route);
route();
</script>
